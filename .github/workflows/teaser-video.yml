name: Video del teaser

on:
  push:
    branches: [teaser-video]

permissions:
  contents: write

jobs:
  registra:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Playwright e ffmpeg
        run: |
          mkdir -p /tmp/rec && cd /tmp/rec && npm init -y >/dev/null && npm i playwright@1.48.2 >/dev/null
          npx playwright install --with-deps chromium
          sudo apt-get install -y ffmpeg >/dev/null
      - name: Registra 16:9
        run: |
          cp scripts/record-teaser.mjs /tmp/rec/ && cd /tmp/rec
          W=1920 H=1080 OUT=frames-wide node record-teaser.mjs
          ffmpeg -y -framerate 30 -i frames-wide/f%05d.png -c:v libx264 -preset slow -crf 16 -pix_fmt yuv420p -movflags +faststart teaser-gestionale-1080p.mp4
      - name: Registra verticale
        run: |
          cd /tmp/rec
          W=1080 H=1350 OUT=frames-tall node record-teaser.mjs
          ffmpeg -y -framerate 30 -i frames-tall/f%05d.png -c:v libx264 -preset slow -crf 16 -pix_fmt yuv420p -movflags +faststart teaser-gestionale-verticale.mp4
      - name: Salva i video
        run: |
          mkdir -p /tmp/out && cp /tmp/rec/*.mp4 /tmp/out/
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git checkout --orphan teaser-video-out
          git rm -rfq .
          cp /tmp/out/*.mp4 .
          git add *.mp4 && git commit -qm "Video del teaser" && git push -f origin teaser-video-out
